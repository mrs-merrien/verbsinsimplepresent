<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  html, body { margin: 0; padding: 0; background: transparent; height: 100%; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; padding: 8px; }
  #quiz-box {
    width: 100%; max-width: 820px; background: #ffffff;
    border-radius: 16px; padding: 20px 24px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.08); border: 1px solid #e2e8f0;
    color: #1e293b;
  }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px; margin-bottom: 14px; }
  .title { font-weight: 700; font-size: 1.15rem; color: #0f172a; margin: 0; }
  .progress { font-size: 0.95rem; font-weight: 600; color: #2563eb; background: #eff6ff; padding: 4px 12px; border-radius: 20px; }
  .question { font-size: 1.2rem; font-weight: 600; margin-bottom: 16px; line-height: 1.35; }
  
  /* Grille 2 colonnes pour gagner de la hauteur */
  .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .opt-btn {
    text-align: left; padding: 12px 16px; border: 2px solid #cbd5e1;
    border-radius: 10px; background: #f8fafc; cursor: pointer;
    font-size: 1.05rem; transition: 0.2s; color: #1e293b; font-weight: 500;
  }
  .opt-btn:hover:not(:disabled) { background: #f1f5f9; border-color: #94a3b8; }
  
  .bottom-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; min-height: 42px; }
  .hint-btn { background: none; border: none; color: #2563eb; cursor: pointer; font-size: 0.95rem; padding: 0; text-decoration: underline; }
  .hint-box { display: none; margin-top: 10px; padding: 8px 12px; background: #eff6ff; border-left: 4px solid #3b82f6; border-radius: 6px; font-size: 0.95rem; }
  .feedback { display: none; margin-top: 12px; padding: 10px 14px; border-radius: 8px; font-size: 1rem; line-height: 1.35; }
  .next-btn { display: none; background: #2563eb; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
  .next-btn:hover { background: #1d4ed8; }
</style>
<script defer="" data-domain="amber-bobbe-91.tiiny.site" src="https://analytics.tiiny.net/js/plausible.js"></script></head>
<body>

<div id="quiz-box"></div>

<script>
document.addEventListener("DOMContentLoaded", function() {
  const quizData = [
    {
      q: "Complete the sentence: 'My friend Leo ... football every Tuesday.'",
      options: ["play", "plays", "playing", "playes"],
      correct: 1,
      reason: "With 'Leo' (3rd person singular: he), add -s to the verb play -> plays.",
      hint: "Think about the pronoun that replaces 'Leo' (he) in the present simple."
    },
    {
      q: "Complete the sentence: 'She ... French and Spanish at school.'",
      options: ["studies", "study", "studys", "studying"],
      correct: 0,
      reason: "Study ends with a consonant + -y: change -y to -ies -> studies.",
      hint: "Look at the ending of 'study' (consonant + y) in the 3rd person singular."
    },
    {
      q: "Complete the sentence: 'Tom always ... his teeth before going to bed.'",
      options: ["brush", "brushs", "brushed", "brushes"],
      correct: 3,
      reason: "Verbs ending in -sh take -es in the 3rd person singular -> brushes.",
      hint: "After -sh, -ch, -s, -x or -z, add -es."
    },
    {
      q: "How is the final -s pronounced in 'He stops the car'?",
      options: ["/z/", "/iz/", "/s/", "/a/"],
      correct: 2,
      reason: "After a voiceless sound like /p/ at the end of stop, the final -s is pronounced /s/.",
      hint: "The /p/ sound is voiceless (your vocal cords do not vibrate)."
    },
    {
      q: "Which present simple verb has an ending pronounced /iz/?",
      options: ["watches", "runs", "plays", "walks"],
      correct: 0,
      reason: "Verbs ending in a sibilant sound (like -tch) add -es pronounced /iz/.",
      hint: "Look for a verb ending in a hissing or buzzing sound (-sh, -ch, -s, -z)."
    },
    {
      q: "Which activity is considered 'outdoor'?",
      options: [
        "Playing chess in the living room",
        "Watching a movie at the cinema",
        "Reading a book in your bedroom",
        "Going for a hike in the mountains"
      ],
      correct: 3,
      reason: "Hiking in the mountains takes place outside in the open air (outdoor).",
      hint: "The prefix 'out-' refers to being outside."
    },
    {
      q: "What is the opposite of 'outdoor'?",
      options: ["Outside", "Indoor", "Underground", "Upstairs"],
      correct: 1,
      reason: "'Indoor' means inside a building or enclosed space.",
      hint: "Replace 'out' with 'in'."
    },
    {
      q: "What does the verb 'begin' mean, and is it regular or irregular?",
      options: [
        "To start / irregular",
        "To start / regular",
        "To finish / irregular",
        "To finish / regular"
      ],
      correct: 0,
      reason: "'Begin' means to start, and it is an irregular verb (begin - began - begun).",
      hint: "Its past simple form is 'began' (it does not end in -ed)."
    },
    {
      q: "Which of the following verbs is a REGULAR verb?",
      options: ["go", "begin", "spend", "play"],
      correct: 3,
      reason: "'Play' is a regular verb (past simple: played).",
      hint: "A regular verb forms its past tense by adding -ed."
    },
    {
      q: "Which phrase correctly uses the verb 'spend'?",
      options: [
        "To spend a book",
        "To spend time with friends",
        "To spend football",
        "To spend breakfast"
      ],
      correct: 1,
      reason: "'Spend' means to pass time (spend time) or pay money (spend money).",
      hint: "You can spend two things: money or time."
    }
  ];

  let current = 0;
  let score = 0;
  let answered = false;

  function renderQuestion() {
    answered = false;
    const item = quizData[current];
    const box = document.getElementById("quiz-box");

    box.innerHTML = `
      <div class="header">
        <p class="title">Present Simple & Daily Verbs</p>
        <span class="progress">Question ${current + 1} / ${quizData.length}</span>
      </div>
      <div class="question">${item.q}</div>
      <div class="options" id="options-list"></div>
      <div class="feedback" id="feedback-box"></div>
      <div class="hint-box" id="hint-box">${item.hint}</div>
      <div class="bottom-bar">
        <button type="button" class="hint-btn" id="hint-btn">Show a hint</button>
        <button type="button" class="next-btn" id="next-btn">
          ${current < quizData.length - 1 ? "Next question ->" : "See my score"}
        </button>
      </div>
    `;

    const list = document.getElementById("options-list");
    item.options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "opt-btn";
      btn.textContent = opt;
      btn.addEventListener("click", function() { checkAnswer(idx, btn); });
      list.appendChild(btn);
    });

    document.getElementById("hint-btn").addEventListener("click", function() {
      const h = document.getElementById("hint-box");
      h.style.display = h.style.display === "block" ? "none" : "block";
    });

    document.getElementById("next-btn").addEventListener("click", nextStep);
  }

  function checkAnswer(idx, btn) {
    if (answered) return;
    answered = true;
    const item = quizData[current];
    const buttons = document.querySelectorAll(".opt-btn");
    const fb = document.getElementById("feedback-box");

    buttons.forEach(b => b.disabled = true);

    if (idx === item.correct) {
      score++;
      btn.style.background = "#dcfce7";
      btn.style.borderColor = "#22c55e";
      fb.style.background = "#dcfce7";
      fb.style.color = "#166534";
      fb.innerHTML = `<strong>Correct!</strong> ${item.reason}`;
    } else {
      btn.style.background = "#fee2e2";
      btn.style.borderColor = "#ef4444";
      buttons[item.correct].style.background = "#dcfce7";
      buttons[item.correct].style.borderColor = "#22c55e";
      fb.style.background = "#fee2e2";
      fb.style.color = "#991b1b";
      fb.innerHTML = `<strong>Incorrect.</strong> ${item.reason}`;
    }

    fb.style.display = "block";
    document.getElementById("next-btn").style.display = "inline-block";
  }

  function nextStep() {
    current++;
    if (current < quizData.length) {
      renderQuestion();
    } else {
      const box = document.getElementById("quiz-box");
      box.innerHTML = `
        <div style="text-align: center; padding: 24px 0;">
          <h2 style="margin-top: 0; font-size: 1.6rem; color: #0f172a;">Quiz completed!</h2>
          <p style="font-size: 1.4rem; font-weight: 700; color: #2563eb; margin: 16px 0;">
            Your score: ${score} / ${quizData.length}
          </p>
          <button type="button" class="next-btn" id="restart-btn" style="display: inline-block;">
            Restart quiz
          </button>
        </div>
      `;
      document.getElementById("restart-btn").addEventListener("click", function() {
        current = 0;
        score = 0;
        renderQuestion();
      });
    }
  }

  renderQuestion();
});
</script>

</body></html>
