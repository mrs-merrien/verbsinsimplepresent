<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
html,body{margin:0;padding:0;background:transparent;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;padding:8px}
#quiz-box{width:100%;max-width:820px;background:#fff;border-radius:16px;padding:20px 24px;box-shadow:0 4px 16px rgba(0,0,0,0.08);border:1px solid #e2e8f0;color:#1e293b}
.header{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid #f1f5f9;padding-bottom:10px;margin-bottom:14px}
.title{font-weight:700;font-size:1.15rem;color:#0f172a;margin:0}
.progress{font-size:0.95rem;font-weight:600;color:#2563eb;background:#eff6ff;padding:4px 12px;border-radius:20px}
.question{font-size:1.2rem;font-weight:600;margin-bottom:16px;line-height:1.35}
.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt-btn{text-align:left;padding:12px 16px;border:2px solid #cbd5e1;border-radius:10px;background:#f8fafc;cursor:pointer;font-size:1.05rem;color:#1e293b;font-weight:500}
.opt-btn:hover:not(:disabled){background:#f1f5f9;border-color:#94a3b8}
.bottom-bar{display:flex;justify-content:space-between;align-items:center;margin-top:14px;min-height:42px}
.hint-btn{background:none;border:none;color:#2563eb;cursor:pointer;font-size:0.95rem;padding:0;text-decoration:underline}
.hint-box{display:none;margin-top:10px;padding:8px 12px;background:#eff6ff;border-left:4px solid #3b82f6;border-radius:6px;font-size:0.95rem}
.feedback{display:none;margin-top:12px;padding:10px 14px;border-radius:8px;font-size:1rem;line-height:1.35}
.next-btn{display:none;background:#2563eb;color:#fff;border:none;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer;font-size:1rem}
</style>
</head>
<body>
<div id="quiz-box"></div>
<script>
const qData=[
["Complete: My friend Leo ... football every Tuesday.",["play","plays","playing","playes"],1,"With Leo (he), add -s to play -> plays.","Leo = he in the present simple."],
["Complete: She ... French and Spanish at school.",["studies","study","studys","studying"],0,"Consonant + -y changes to -ies -> studies.","Check the ending of study (consonant + y)."],
["Complete: Tom always ... his teeth before bed.",["brush","brushs","brushed","brushes"],3,"Verbs ending in -sh take -es -> brushes.","After -sh, -ch, -s, -x or -z, add -es."],
["How is the final -s pronounced in: He stops the car?",["/z/","/iz/","/s/","/a/"],2,"After a voiceless sound like /p/, -s is pronounced /s/.","The /p/ sound is voiceless."],
["Which verb has an ending pronounced /iz/?",["watches","runs","plays","walks"],0,"After a sibilant sound (-tch), -es is pronounced /iz/.","Look for a hissing sound (-sh, -ch, -s, -z)."],
["Complete: Bijay ... History and Geography every day.",["study","studys","studies","studying"],2,"Bijay = he. Consonant + -y changes to -ies -> studies.","Check the rule for consonant + -y."],
["Complete: My sister ... to school by bus.",["go","gos","going","goes"],3,"Verbs ending in -o take -es -> goes.","Verbs ending in -o add -es with he, she, it."],
["How is the final -s pronounced in: He reads a book?",["/s/","/z/","/iz/","/a/"],1,"After a voiced sound like /d/, -s is pronounced /z/.","/d/ is a voiced sound."],
["Complete: Sarah ... a letter to her cousin.",["writes","write","writs","writing"],0,"With Sarah (she), add -s to write -> writes.","Write ends in -e, just add -s."],
["How is the final -s pronounced in: He writes a story?",["/z/","/iz/","/s/","/a/"],2,"After the voiceless /t/ sound, -s is pronounced /s/.","/t/ is a voiceless sound."],
["Complete: School ... at 8:30 in the morning.",["start","startes","starting","starts"],3,"School = it, so add -s -> starts.","School can be replaced by it."],
["Complete: The movie ... at 10 o clock.",["finish","finishes","finishs","finishing"],1,"Verbs ending in -sh take -es -> finishes.","Look at the last two letters of finish."],
["Which verb has an ending pronounced /iz/?",["brushes","reads","eats","drinks"],0,"Brushes ends with -sh, so -es is pronounced /iz/.","Find the verb with an extra syllable."],
["Complete: He ... a lot of time with his friends.",["spend","spendes","spends","spending"],2,"With he, add -s to spend -> spends.","Standard 3rd person rule: verb + -s."],
["Complete: My brother ... a sandwich for lunch.",["eat","eates","eating","eats"],3,"My brother = he, so add -s -> eats.","My brother = he."],
["How is the final -s pronounced in: She eats an apple?",["/z/","/s/","/iz/","/a/"],1,"After the voiceless /t/ sound, -s is pronounced /s/.","/t/ is voiceless."],
["Complete: She ... orange juice every morning.",["drinks","drink","drinkes","drinking"],0,"With she, add -s to drink -> drinks.","Add -s for 3rd person singular."],
["How is the final -s pronounced in: He drinks water?",["/z/","/iz/","/s/","/a/"],2,"After the voiceless /k/ sound, -s is pronounced /s/.","/k/ is a voiceless sound."],
["Complete: Emma ... very well in the choir.",["sing","singes","singing","sings"],3,"Emma = she, so add -s -> sings.","Emma = she."],
["How is the final -s pronounced in: He plays with friends?",["/s/","/z/","/iz/","/a/"],1,"After a vowel sound, -s is pronounced /z/.","Vowel sounds are voiced."],
["Complete: He ... his computer for his homework.",["uses","use","usies","using"],0,"Use ends in -e, just add -s -> uses.","Add -s to use."],
["How is the final -s pronounced in: She uses a tablet?",["/s/","/z/","/iz/","/a/"],2,"Use ends in /z/, so adding -s is pronounced /iz/.","You hear two syllables: u-ses."],
["Complete: Claire ... hip-hop every Wednesday.",["dance","dances","dancies","dancing"],1,"Claire = she. Add -s to dance -> dances.","Claire = she."],
["How is the final -s pronounced in: She dances well?",["/s/","/z/","/iz/","/a/"],2,"Dance ends in /s/, so adding -s is pronounced /iz/.","Hissing sounds take /iz/."],
["Complete: The lesson ... at 9:00 AM.",["begin","begines","beginning","begins"],3,"The lesson = it, so add -s -> begins.","The lesson = it."]
];
let cur=0,sc=0,done=false;
const box=document.getElementById("quiz-box");
function show(){
  done=false;const d=qData[cur];
  box.innerHTML='<div class="header"><p class="title">Present Simple: 3rd Person & Pronunciation</p><span class="progress">Question '+(cur+1)+' / '+qData.length+'</span></div><div class="question">'+d[0]+'</div><div class="options" id="opts"></div><div class="feedback" id="fb"></div><div class="hint-box" id="hb">'+d[4]+'</div><div class="bottom-bar"><button type="button" class="hint-btn" id="hbtn">Show a hint</button><button type="button" class="next-btn" id="nbtn">'+(cur<qData.length-1?"Next question":"See my score")+'</button></div>';
  const opts=document.getElementById("opts");
  d[1].forEach((o,i)=>{
    const b=document.createElement("button");b.type="button";b.className="opt-btn";b.textContent=o;
    b.onclick=()=>ans(i,b);opts.appendChild(b);
  });
  document.getElementById("hbtn").onclick=()=>{const h=document.getElementById("hb");h.style.display=h.style.display==="block"?"none":"block"};
  document.getElementById("nbtn").onclick=nxt;
}
function ans(i,b){
  if(done)return;done=true;const d=qData[cur],btns=document.querySelectorAll(".opt-btn"),fb=document.getElementById("fb");
  btns.forEach(x=>x.disabled=true);
  if(i===d[2]){sc++;b.style.background="#dcfce7";b.style.borderColor="#22c55e";fb.style.background="#dcfce7";fb.style.color="#166534";fb.innerHTML="<b>Correct!</b> "+d[3]}
  else{b.style.background="#fee2e2";b.style.borderColor="#ef4444";btns[d[2]].style.background="#dcfce7";btns[d[2]].style.borderColor="#22c55e";fb.style.background="#fee2e2";fb.style.color="#991b1b";fb.innerHTML="<b>Incorrect.</b> "+d[3]}
  fb.style.display="block";document.getElementById("nbtn").style.display="inline-block";
}
function nxt(){
  cur++;
  if(cur<qData.length)show();
  else{
    box.innerHTML='<div style="text-align:center;padding:24px 0"><h2 style="margin-top:0;font-size:1.6rem;color:#0f172a">Quiz completed!</h2><p style="font-size:1.4rem;font-weight:700;color:#2563eb;margin:16px 0">Your score: '+sc+' / '+qData.length+'</p><button type="button" class="next-btn" id="rbtn" style="display:inline-block">Restart quiz</button></div>';
    document.getElementById("rbtn").onclick=()=>{cur=0;sc=0;show()};
  }
}
show();
</script>
</body>
</html>
